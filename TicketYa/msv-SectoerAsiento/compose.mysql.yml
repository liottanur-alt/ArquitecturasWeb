services:
  mysql-sector:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sectores_asientos
      MYSQL_USER: sector_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-sector_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - sector-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  sector-data:
