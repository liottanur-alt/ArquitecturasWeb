# Base descartable de pruebas: no utiliza el volumen ni el esquema de desarrollo.
services:
  mysql-inventario-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventario_test
      MYSQL_USER: test_app
      MYSQL_PASSWORD: test_app
      MYSQL_ROOT_PASSWORD: test_root
    ports:
      - "3309:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
