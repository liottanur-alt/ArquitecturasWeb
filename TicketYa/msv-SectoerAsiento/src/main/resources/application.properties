spring.application.name=msv-SectoerAsiento

# Eventos usa el contrato real de main; Compras mantiene una URL provisional.
msvc.eventos.url=${MSVC_EVENTOS_URL:http://localhost:8005}
msvc.compras.url=${MSVC_COMPRAS_URL:http://localhost:8003}
spring.cloud.openfeign.client.config.msvc-eventos.connectTimeout=3000
spring.cloud.openfeign.client.config.msvc-eventos.readTimeout=5000
spring.cloud.openfeign.client.config.msvc-compras.connectTimeout=3000
spring.cloud.openfeign.client.config.msvc-compras.readTimeout=5000

# Persistencia local; las credenciales pueden reemplazarse con variables de entorno.
server.port=${SERVER_PORT:8002}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3310/sectores_asientos}
spring.datasource.username=${DB_USERNAME:sector_app}
spring.datasource.password=${DB_PASSWORD:sector_dev}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
inventario.reserva-minutos=10
inventario.barrido-ms=30000
inventario.zona-eventos=America/Argentina/Buenos_Aires
