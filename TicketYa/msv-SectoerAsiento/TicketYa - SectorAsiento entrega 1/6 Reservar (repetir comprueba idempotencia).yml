info:
  name: 6 Reservar (repetir comprueba idempotencia)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/reservas"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{"claveIdempotencia":"{{claveReserva}}","idCliente":1,"idEvento":{{idEvento}},"idSector":{{idSector}},"cantidad":1,"idAsientos":[{{idAsiento}}]}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.getStatus() < 300) bru.setCollectionVar("idReserva", res.getBody().id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
