info:
  name: 4 Configurar sector del evento
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/eventos/{{idEvento}}/sectores"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{"idSector":{{idSector}},"precio":1500,"capacidadHabilitada":1}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
