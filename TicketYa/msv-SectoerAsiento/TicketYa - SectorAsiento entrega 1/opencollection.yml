opencollection: 1.0.0

info:
  name: TicketYa - SectorAsiento entrega 1

request:
  variables:
    - name: baseUrl
      value: http://localhost:8080
    - name: idEvento
      value: "1"
    - name: idSector
      value: "1"
    - name: idAsiento
      value: "1"
    - name: idReserva
      value: "1"
    - name: claveReserva
      value: compra-demo-001
    - name: claveDevolucion
      value: devolucion-demo-001
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
