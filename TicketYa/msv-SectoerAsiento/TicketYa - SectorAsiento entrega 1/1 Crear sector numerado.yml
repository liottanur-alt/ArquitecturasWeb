info:
  name: 1 Crear sector numerado
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/sectores"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{"idLugar": 1, "nombre": "Platea", "tipo": "NUMERADO", "capacidadTotal": 1}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.getStatus() < 300) bru.setCollectionVar("idSector", res.getBody().id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
