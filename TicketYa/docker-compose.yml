name: ticketya-db

x-mysql-environment: &mysql-environment
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_ticketya_dev}
  MYSQL_USUARIO_PASSWORD: ${USUARIO_DB_PASSWORD:-${DB_PASSWORD:-usuario_dev}}
  MYSQL_EVENTO_PASSWORD: ${EVENTO_DB_PASSWORD:-${DB_PASSWORD:-evento_dev}}
  MYSQL_COMPRA_PASSWORD: ${COMPRA_DB_PASSWORD:-${DB_PASSWORD:-compra_dev}}
  MYSQL_SECTOR_PASSWORD: ${SECTOR_DB_PASSWORD:-${DB_PASSWORD:-sector_dev}}
  MYSQL_NOTIFICACIONES_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-${DB_PASSWORD:-notificaciones_dev}}

services:
  notificaciones:
    build: ./msv-notificaciones
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/notificaciones
      DB_USERNAME: notificaciones_app
      DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-${DB_PASSWORD:-notificaciones_dev}}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-${SMTP_USERNAME:-no-reply@ticketya.local}}
    depends_on:
      mysql-esquemas:
        condition: service_completed_successfully

  usuarios:
    build: ./msv-usuario
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/usuarios
      MSV_EVENTO_URL: http://eventos:8005
      MSV_COMPRAS_URL: http://compras:8003
      MSV_SECTORES_URL: http://sectores:8002
      JWT_SECRET: "${JWT_SECRET:?Definir JWT_SECRET en .env o en el entorno (minimo 32 bytes)}"
      ADMIN_SEED_PASSWORD: "${ADMIN_SEED_PASSWORD:?Definir ADMIN_SEED_PASSWORD en .env o en el entorno}"
    depends_on:
      mongodb:
        condition: service_healthy
      eventos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8004/actuator/health"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 60s

  eventos:
    build: ./msv-evento
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/eventos
      DB_USERNAME: evento_app
      EVENTO_DB_PASSWORD: ${EVENTO_DB_PASSWORD:-${DB_PASSWORD:-evento_dev}}
      MSVC_SECTORES_URL: http://sectores:8002
      MSVC_USUARIOS_URL: http://usuarios:8004
      MSVC_COMPRAS_URL: http://compras:8003
      MSVC_NOTIFICACIONES_URL: http://notificaciones:8006
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILA_MAX_COMPRADORES_SIMULTANEOS: ${FILA_MAX_COMPRADORES_SIMULTANEOS:-10}
      FILA_DURACION_TURNO_SEGUNDOS: 900
      JWT_SECRET: "${JWT_SECRET:?Definir JWT_SECRET en .env o en el entorno (minimo 32 bytes)}"
    depends_on:
      mysql-esquemas:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8005/actuator/health"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 60s

  sectores:
    build: ./msv-SectoerAsiento
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sectores_asientos
      DB_USERNAME: sector_app
      SECTOR_DB_PASSWORD: ${SECTOR_DB_PASSWORD:-${DB_PASSWORD:-sector_dev}}
      MSVC_EVENTOS_URL: http://eventos:8005
      MSVC_COMPRAS_URL: http://compras:8003
      JWT_SECRET: "${JWT_SECRET:?Definir JWT_SECRET en .env o en el entorno (minimo 32 bytes)}"
    depends_on:
      mysql-esquemas:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8002/actuator/health"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 60s

  compras:
    build: ./msv-compraEntardaSol
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/compra_entrada_sol
      DB_USERNAME: compra_app
      DB_PASSWORD: ${COMPRA_DB_PASSWORD:-${DB_PASSWORD:-compra_dev}}
      MSVC_EVENTOS_URL: http://eventos:8005
      MSVC_SECTORES_URL: http://sectores:8002
      MSVC_USUARIOS_URL: http://usuarios:8004
      MSVC_NOTIFICACIONES_URL: http://notificaciones:8006
      JWT_SECRET: "${JWT_SECRET:?Definir JWT_SECRET en .env o en el entorno (minimo 32 bytes)}"
    depends_on:
      mysql-esquemas:
        condition: service_completed_successfully
      eventos:
        condition: service_healthy
      sectores:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8003/actuator/health"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 60s

  gateway:
    build: ./api-gateway
    restart: unless-stopped
    environment:
      MSVC_USUARIOS_URL: http://usuarios:8004
      MSVC_EVENTOS_URL: http://eventos:8005
      MSVC_SECTORES_URL: http://sectores:8002
      MSVC_COMPRAS_URL: http://compras:8003
      JWT_SECRET: "${JWT_SECRET:?Definir JWT_SECRET en .env o en el entorno (minimo 32 bytes)}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      usuarios:
        condition: service_healthy
      eventos:
        condition: service_healthy
      sectores:
        condition: service_healthy
      compras:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 60s

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - usuarios_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment: *mysql-environment
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/check-health.sh:/opt/ticketya/check-health.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -uroot -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-esquemas:
    image: mysql:8.4
    network_mode: service:mysql
    environment: *mysql-environment
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./docker/mysql/crear-esquemas.sh:/opt/ticketya/crear-esquemas.sh:ro
      - ./docker/mysql/check-health.sh:/opt/ticketya/check-health.sh:ro
    entrypoint: ["bash", "/opt/ticketya/crear-esquemas.sh"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  usuarios_mongo:
    # Mismo volumen del entorno aislado: conserva los usuarios existentes.
    name: ticketya-usuarios-local_usuarios_mongo
  mysql_data:
    name: ticketya_mysql_data
  redis_data:
    name: ticketya_redis_data
