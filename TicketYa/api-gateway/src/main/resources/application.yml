server:
  port: 8080

msvc:
  usuarios:
    url: ${MSVC_USUARIOS_URL:http://localhost:8004}

spring:
  application:
    name: apigateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: msvc-usuarios
              uri: ${msvc.usuarios.url}
              predicates:
                - Path=/auth/**,/usuarios,/usuarios/**,/roles,/roles/**
