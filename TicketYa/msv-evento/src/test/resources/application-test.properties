spring.datasource.url=jdbc:h2:mem:eventos-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.cache.type=simple
management.health.redis.enabled=false
# Valor exclusivo de pruebas. Coincide con el usado por los demas modulos en su perfil test.
security.jwt.secret=${JWT_SECRET:clave-de-prueba-solo-tests-1234567890abcdef}
security.jwt.issuer=msv-usuario
