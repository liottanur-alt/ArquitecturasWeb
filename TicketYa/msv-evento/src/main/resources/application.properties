spring.application.name=msv-evento
server.port=8005

# Conexion local: Spring Boot desde IntelliJ y MySQL en Docker.
# Si Spring Boot se ejecuta en la misma red Docker, usar como host mysql-evento:3306.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/eventos}
spring.datasource.username=${DB_USERNAME:evento_app}
spring.datasource.password=${DB_PASSWORD:evento_dev}

# Desarrollo: Hibernate crea y actualiza las tablas sin borrar los datos al iniciar.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false




