spring.application.name=msv-evento
server.port=8005

# Conexion local: Spring Boot desde IntelliJ y MySQL en Docker.
# Si Spring Boot se ejecuta en la misma red Docker, usar como host mysql:3306.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventos}
spring.datasource.username=${DB_USERNAME:evento_app}
spring.datasource.password=${EVENTO_DB_PASSWORD:${DB_PASSWORD:evento_dev}}

# Desarrollo: Hibernate crea y actualiza las tablas sin borrar los datos al iniciar.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.cache.type=redis
spring.cache.redis.time-to-live=60s
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
fila.max-compradores-simultaneos=${FILA_MAX_COMPRADORES_SIMULTANEOS:10}
fila.duracion-turno-segundos=${FILA_DURACION_TURNO_SEGUNDOS:900}
msvc.sectores.url=${MSVC_SECTORES_URL:http://localhost:8002}
spring.cloud.openfeign.client.config.msvc-sectores.connectTimeout=3000
spring.cloud.openfeign.client.config.msvc-sectores.readTimeout=5000
server.error.include-message=always




