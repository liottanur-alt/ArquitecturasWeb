name: ticketya-evento

services:
  mysql-evento:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eventos
      MYSQL_USER: evento_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-evento_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_evento_dev}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_evento_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_evento_data: