spring.application.name=msv-compra-entrada-sol
server.port=${SERVER_PORT:8003}
msvc.sectores.url=${MSVC_SECTORES_URL:http://localhost:8002}
msvc.eventos.url=${MSVC_EVENTOS_URL:http://localhost:8005}
spring.cloud.openfeign.client.config.msvc-sectores.connectTimeout=3000
spring.cloud.openfeign.client.config.msvc-sectores.readTimeout=5000
spring.cloud.openfeign.client.config.msvc-eventos.connectTimeout=3000
spring.cloud.openfeign.client.config.msvc-eventos.readTimeout=5000

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/compra_entrada_sol}
spring.datasource.username=${DB_USERNAME:compra_app}
spring.datasource.password=${DB_PASSWORD:compra_dev}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.pattern.level=%5p [correlationId:%X{correlationId}]
