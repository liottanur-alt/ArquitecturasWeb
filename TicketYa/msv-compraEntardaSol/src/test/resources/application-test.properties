spring.datasource.url=jdbc:h2:mem:compra_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Los clientes Feign se reemplazan con @MockitoBean en los tests.
msvc.sectores.url=http://localhost:19998
msvc.eventos.url=http://localhost:19999

logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.web=warn
