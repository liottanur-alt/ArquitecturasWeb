spring.application.name=msv-usuario
server.port=8004

# Conexion local: Spring Boot desde IntelliJ y MySQL en Docker.
# Si Spring Boot se ejecuta en la misma red Docker, usar como host mysql-usuario:3306.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/usuarios}
spring.datasource.username=${DB_USERNAME:usuario_app}
spring.datasource.password=${DB_PASSWORD:usuario_dev}

# Desarrollo: Hibernate crea y actualiza las tablas sin borrar los datos al iniciar.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# URL de ejemplo: reemplazar por la URL real del microservicio de artistas.
msvc.artistas.url=${MSVC_ARTISTAS_URL:http://localhost:8005}
spring.cloud.openfeign.client.config.msvc-artistas.connectTimeout=3000
spring.cloud.openfeign.client.config.msvc-artistas.readTimeout=5000
