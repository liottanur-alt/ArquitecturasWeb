spring.application.name=msv-usuario
server.port=8004
spring.profiles.default=dev


# Conexion local: Spring Boot desde IntelliJ y MySQL en Docker.
# Si Spring Boot se ejecuta en la misma red Docker, usar como host mysql:3306.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/usuarios}
spring.datasource.username=${DB_USERNAME:usuario_app}
spring.datasource.password=${USUARIO_DB_PASSWORD:${DB_PASSWORD:usuario_dev}}

# Desarrollo: Hibernate crea y actualiza las tablas sin borrar los datos al iniciar.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# URL de ejemplo: reemplazar por la URL real del microservicio de artistas.
msv.evento.url=${MSV_EVENTO_URL:http://localhost:8005}
spring.cloud.openfeign.client.config.msv-evento.connectTimeout=3000
spring.cloud.openfeign.client.config.msv-evento.readTimeout=5000
