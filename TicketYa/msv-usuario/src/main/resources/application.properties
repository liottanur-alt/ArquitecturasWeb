spring.application.name=msv-usuario
app.service-name=msv-usuario
server.port=8004
spring.profiles.default=dev


# Conexion local: MongoDB en el puerto 27017, base usuarios.
# MONGODB_URI permite reemplazar la conexion segun el entorno.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/usuarios}
# Crea los indices declarados con @Indexed, incluidos los unicos.
spring.data.mongodb.auto-index-creation=true

# El secreto se entrega exclusivamente por entorno; no existe valor por defecto.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=msv-usuario
security.jwt.ttl-seconds=1800

# URL de ejemplo: reemplazar por la URL real del microservicio de artistas.
msv.evento.url=${MSV_EVENTO_URL:http://localhost:8005}
spring.cloud.openfeign.client.config.msv-evento.connectTimeout=3000
spring.cloud.openfeign.client.config.msv-evento.readTimeout=5000
spring.cloud.openfeign.client.config.eventos-recomendaciones.connectTimeout=3000
spring.cloud.openfeign.client.config.eventos-recomendaciones.readTimeout=5000
msv.compras.url=${MSV_COMPRAS_URL:http://localhost:8003}
spring.cloud.openfeign.client.config.compras-recomendaciones.connectTimeout=3000
spring.cloud.openfeign.client.config.compras-recomendaciones.readTimeout=5000
msv.sectores.url=${MSV_SECTORES_URL:http://localhost:8002}
spring.cloud.openfeign.client.config.inventario-recomendaciones.connectTimeout=3000
spring.cloud.openfeign.client.config.inventario-recomendaciones.readTimeout=5000
