name: ticketya-notificaciones

services:
  mysql-notificaciones:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: notificaciones
      MYSQL_USER: notificaciones_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-notificaciones_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_notificaciones_dev}
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - mysql_notificaciones_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_notificaciones_data:
