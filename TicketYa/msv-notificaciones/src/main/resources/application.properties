spring.application.name=msv-notificaciones
server.port=${SERVER_PORT:8006}
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/notificaciones}
spring.datasource.username=${DB_USERNAME:notificaciones_app}
spring.datasource.password=${DB_PASSWORD:notificaciones_dev}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notificaciones.mail.remitente=${SMTP_FROM:${SMTP_USERNAME:no-reply@ticketya.local}}