services:
  db_postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=integrador1
      - TZ=UTC
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./Integrador1/src/main/java/Repository/postgres/Integrador1_postgres.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pg_data: