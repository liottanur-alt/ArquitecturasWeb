# ===================================================================
# CONFIGURACIÓN DE SERVIDOR (Opcional - Puerto por defecto 8080)
# ===================================================================
server.port=8080

# ===================================================================
# CONEXIÓN A LA BASE DE DATOS (MySQL)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/integrador1?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# Generación automática del esquema (none, validate, update, create, create-drop)
spring.jpa.hibernate.ddl-auto=update

# Dialecto de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostrar consultas SQL en la consola (true / false)
spring.jpa.show-sql=false

# Formatear el SQL mostrado en consola para facilitar su lectura
spring.jpa.properties.hibernate.format_sql=true

# Desactivar estadísticas de Hibernate
spring.jpa.properties.hibernate.generate_statistics=false